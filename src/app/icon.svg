<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The real Map App mark as the browser-tab favicon, replacing the old
    generic favicon.ico. Same design as src/components/MapAppMark.tsx's
    badge (gradient + sailboat glyph, itself traced from the original
    prototype's logo, boatlocalprototype.netlify.app) — kept in sync by
    eye since one is inline JSX and this is a static file Next.js serves
    directly via the `app/icon.svg` convention (node_modules/next/dist/docs
    /01-app/03-api-reference/03-file-conventions/01-metadata/app-icons.md).
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(150 0.5 0.5)">
      <stop offset="0%" stop-color="#1B5FE3" />
      <stop offset="100%" stop-color="#FF7A45" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#g)" />
  <g transform="translate(6.4 6.4) scale(0.6)">
    <ellipse cx="16" cy="21" rx="12" ry="4.5" stroke="white" stroke-width="2.2" fill="none" />
    <path d="M16 5 C16 5 9 13 9 18" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M16 5 C16 5 23 13 23 18" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="16" cy="5" r="2.6" fill="white" />
    <line x1="16" y1="7.6" x2="16" y2="16" stroke="white" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
